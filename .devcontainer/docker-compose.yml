services:
  app:
    container_name: uniscope-app
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - mongo
    networks:
      - uniscope-network

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: uniscope-mongo
    hostname: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    networks:
      - uniscope-network

networks:
  uniscope-network:
    driver: bridge

volumes:
  db:
  configdb:
  mongot:
